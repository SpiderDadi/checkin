name: run
on:
  schedule:
    - cron: '17 0 * * *' # 每天北京时间早上 08:17 左右运行（避开 08:00 整点拥堵）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
          SERVERCHAN_SENDKEY: ${{ secrets.NOTIFY }}
          EXCHANGE_PLAN: "plan500" # 500分自动兑换100天，不需要可设为 off
        run: |
          sleep $((RANDOM % 180))
          python checkin.py
