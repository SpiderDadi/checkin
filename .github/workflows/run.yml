name: run
on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间 8 点左右运行（根据需要调整）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EXCHANGE_PLAN: "plan500" # 500分自动兑换100天，不需要可设为 off
        run: |
          python checkin.py
